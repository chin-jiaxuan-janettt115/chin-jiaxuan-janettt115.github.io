<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxygen:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Oxygen", sans-serif;
        }

        .dailou {
            background-color: rgb(141, 161, 161);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu {
            display: flex;
        }

        .services {
            color: #f9612b;
        }

        .right div {
            display: flex;
        }

        .rightpanel {
            gap: 20px;
        }

        .phone {
            gap: 10px;
            align-items: center;
        }

        .phone p {
            font-weight: bolder;
        }

        .phone img {
            width: 20px;
            height: 20px;
        }

        .contactbutton a {
            text-decoration: none;
            background-color: #f9612b;
            color: white;
            padding: 13px 17px;
            border-radius: 8px;
            font-size: 15px;
        }
    </style>
</head>

<body>
    <div class="dailou">
        <div class="logo"><img src="image/logo.png" alt="logo" width="200px"></div>
        <div class="menu">
            <div class="home">Home</div>
            <div class="services">Services</div>
            <div class="work">Work</div>
            <div class="project detail">Project Details</div>
            <div class="contact">Contact</div>
        </div>
        <div class="right">
            <div class="phone">
                <img src="image/phone.png" alt="phone">
                <p>555-123-4567</p>
            </div>
            <div class="contactbutton">
                <a href="https://construction.elementra.themerex.net/contact/">Contact</a>
            </div>
        </div>
    </div>

</body>

</html>
