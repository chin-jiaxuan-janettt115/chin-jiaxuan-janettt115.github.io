<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxygen:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<style>
    body {
        background-color: black;
        font-family: "Oxygen", sans-serif;
        font-size: 15px;
    }

    .dailou {
        background-color: white;
        padding: 7px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .dailou div {
        display: flex
    }

    .phone {
        align-items: center;
        gap: 10px;
        font-weight: bolder;
    }

    .phone img {
        width: 20px;
        height: 20px;
    }

    .menu {
        gap: 10px;
    }

    .services {
        color: #f9612b;
    }

    .right {
        gap: 20px;
        align-items: center;
    }

    .contactbutton a {
        text-decoration: none;
        background-color: #f9612b;
        color: white;
        padding: 13px 17px;
        border-radius: 8px;

    }

    .hamburger {
        width: 30px;
        height: 30px;
    }

    @media screen and (min-width: 1300px) {

        .hamburger img {
            display: none;
        }
    }

    @media screen and (max-width: 1300px) {
        .contactbutton a {
            display: none;
        }
    }

    @media screen and (max-width: 1000px) {
        .menu div {
            display: none;
        }

        .phone img,
        p {
            display: none;
        }
    }
</style>

<body>
    <div class="dailou">
        <div class="logo"><img src="image/logo.png" alt="logo" width="200px"></div>
        <div class="menu">
            <div class="home">Home</div>
            <div class="services">Services</div>
            <div class="work">Work</div>
            <div class="project detail">Project Details</div>
            <div class="contact">Contact</div>
        </div>
        <div class="right">
            <div class="phone">
                <img src="image/phone.png" alt="phone">
                <p>555-123-4567</p>
            </div>
            <div class="contactbutton">
                <a href="https://construction.elementra.themerex.net/contact/">Contact</a>
            </div>
            <div class="hamburger"><img src="image/hamburger.png" alt="menu"></div>
        </div>
    </div>

</body>

</html>
