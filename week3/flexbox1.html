<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxygen:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color:
                #f6f5ef;
        }

        .dailou {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 50px;
        }

        .dailou div {
            background-color: #ffffff;
            padding: 15px;
            border-radius: 10px;
            width: calc(100% / 3);
            margin: auto;
        }

        .dailou div img {
            width: 100%;
            border-radius: 10px;
        }

        .dailou div h1 {
            font-family: "Oxygen", sans-serif;
            font-size: 25px;
        }

        .dailou div p {
            font-family: "Oxygen", sans-serif;
            font-size: 14px;
            color: #4c4c4c;
        }
    </style>
</head>

<body>
    <div class="dailou">
        <div class="residential">
            <img src="image/1.jpg" alt="residential">
            <h1>Residential project</h1>
            <p>We build sustainable and modern homes for comfortable living.</p>
        </div>
        <div class="commercial">
            <img src="image/2.jpg" alt="commercial">
            <h1>Commercial spaces</h1>
            <p>We create efficient inspiring workspaces for businesses of all sizes.</p>
        </div>
        <div class="infrastructure">
            <img src="image/3.jpg" alt="infrastructure">
            <h1>Infrastructure works</h1>
            <p>We develop strong,reliable infranstructure for growing communities.</p>
        </div>
    </div>
</body>

</html>
