<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox2</title>
    <style>
        body {
            background-color: black;
        }

        .navbar {
            background-color: white;
            padding: 7px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }


        .hamburger img {
            width: 30px;
            height: 30px;
        }


        .second div {
            display: flex;
        }

        .right {
            gap: 10px;
            align-items: center;
        }

        .phone {
            align-items: center;
            gap: 10px;
        }

        .phone img {
            width: 20px;
            height: 20px;
        }

        .phone p {
            font-weight: bolder;
            font-family: "Oxygen", sans-serif;
            font-size: 15px;
        }

        .hamburger img {
            width: 30px;
            height: 30px;
        }

        .dailou div {
            display: flex
        }

        .menu {
            gap: 35px;
            font-family: "Oxygen", sans-serif;
        }

        .services {
            color: #f9612b;
        }

        .rightpanel {
            gap: 20px;
        }

        .phone {
            gap: 10px;
            align-items: center;
        }

        .phone p {
            font-weight: bolder;
            font-family: "Oxygen", sans-serif;
            font-size: 15px;
        }

        .phone img {
            width: 20px;
            height: 20px;
        }

        .contactbutton a {
            font-family: "Oxygen", sans-serif;
            text-decoration: none;
            background-color: #f9612b;
            color: white;
            padding: 13px 17px;
            border-radius: 8px;
            font-size: 15px;
            align-content: center;
        }
    </style>
</head>

<body>
    <div class=" navbar first">
        <div class="logo">
            <img src="image/logo.png" alt="logo" width="200px">
        </div>
        <div class="hamburger">
            <img src="image/hamburger.png" alt="hamburger">
        </div>
    </div>

    <div class="navbar second">
        <div class="logo">
            <img src="image/logo.png" alt="logo" width="200px">
        </div>
        <div class="right">
            <div class="phone">
                <img src="image/phone.png" alt="phone">
                <p>555-123-4567</p>
            </div>
            <div class="hamburger">
                <img src="image/hamburger.png" alt="hamburger">
            </div>
        </div>
    </div>




    <div class="navbar dailou">
        <div class="logo"><img src="image/logo.png" alt="logo" width="200px"></div>

        <div class="menu">
            <div class="home">Home</div>
            <div class="services">Services</div>
            <div class="work">Work</div>
            <div class="project detail">Project Details</div>
            <div class="contact">Contact</div>
        </div>
        <div class="rightpanel">
            <div class="phone">
                <img src="image/phone.png" alt="phone">
                <p>555-123-4567</p>
            </div>
            <div class="contactbutton">
                <a href="https://construction.elementra.themerex.net/contact/">Contact</a>
            </div>
        </div>
    </div>
</body>

</html>
