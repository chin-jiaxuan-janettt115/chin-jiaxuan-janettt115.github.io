<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Space Grotesk", sans-serif;
            padding: 0px 100px;
            margin-top: 51px;
            color: #191a23;
        }

        body p {
            font-size: 20px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 51px;
            font-size: 20px;
        }

        .positivus img {
            width: 219.54;
            height: 38px;
        }

        .toppanel {
            display: flex;
            gap: 40px;
        }

        .panel {
            display: flex;
            gap: 40px;
        }


        .request a {
            border: 1px solid#191A23;
            border-radius: 14px;
            padding: 20px 35px;
            background-color: white;
            font-size: 20px;
            text-decoration: none;
            color: #191A23;

        }

        .content {
            display: flex;
            gap: 200px;
            justify-content: space-between;
        }

        .word h1 {
            font-size: 60px;
        }

        .book p {
            display: inline-block;
            color: white;
            background-color: #191A23;
            border-radius: 14px;
            padding: 20px 35px;
        }

        .bottom {
            margin-top: 51px;
            display: flex;
            justify-content: space-between;
            gap: 100px;
        }
    </style>
</head>

<body>
    <div class="top">
        <div class="positivus"><img src="image/positivus.png" alt="logo"></div>
        <div class="toppanel">
            <div class="panel">
                <div class="about">About us</div>
                <div class="services">Services</div>
                <div class="use">Use Cases</div>
                <div class="pricing">Pricing</div>
                <div class="blog">Blog</div>
            </div>
            <div class="request">
                <a href="#">Request a quote</a>
            </div>
        </div>
    </div>
    <div class="content">
        <div class="left">
            <div class="word">
                <h1>Navigating the digital landscape for success</h1>
                <p>Our digital marketing agency helps businesses grow and succeed online through a range of services
                    including SEO,PPC, social media marketing, and content creation</p>
            </div>
            <div class="book">
                <p>Book a concultation</p>
            </div>
        </div>

        <div class="right">
            <img src="image/Illustration.png" alt="illustration">
        </div>
    </div>
    <div class="bottom">
        <img src="image/Company logo.png" alt="amazon">
        <img src="image/Company logo-1.png" alt="drillle">
        <img src="image/Company logo-2.png" alt="hubspot">
        <img src="image/Company logo-3.png" alt="notion">
        <img src="image/Company logo-4.png" alt="netflix">
        <img src="image/Company logo-5.png" alt="zoom">
    </div>

</body>

</html>
