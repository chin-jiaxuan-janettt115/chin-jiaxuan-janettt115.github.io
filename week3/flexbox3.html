<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <style>
        .top {
            display: flex;
            justify-content: space-between;
            margin-top: 51px;
            padding: 0px 100px;
            font-family: "Space Grotesk", sans-serif;
            font-size: 20px;

        }

        .top div.positivus img {
            width: 219.54;
            height: 38px;
        }

        .top div.toppanel {
            display: flex;
            gap: 40px;
        }

        .top div.toppanel div.panel {
            display: flex;
            gap: 40px;
        }

        .top div.toppanel div.button a {
            text-decoration: none;
            border: 1px black solid;
            border-radius: 14px;
            padding: 20px 35px;

        }
    </style>
</head>

<body>
    <div class="top">
        <div class="positivus"><img src="image/positivus.png" alt="logo"></div>
        <div class="toppanel">
            <div class="panel">
                <div class="about">About us</div>
                <div class="services">Services</div>
                <div class="use">Use Cases</div>
                <div class="pricing">Pricing</div>
                <div class="blog">Blog</div>
            </div>
            <div class="button">
                <a href="http://127.0.0.1:5500/week3/flexbox3.html">Request a quote</a>
            </div>
        </div>
    </div>
    <div class="left"></div>
    <div class="right"></div>
    <div class="bottom"></div>

</body>

</html>
