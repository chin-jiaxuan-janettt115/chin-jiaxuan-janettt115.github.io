<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxygen:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #E3FDFD;
            margin: 2%;
        }

        body h1 {
            color: #3eacb2;
            font-family: "Oxygen", sans-serif;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input::placeholder,
        textarea::placeholder,
        input[type="date"] {
            color: #71C9CE;
        }

        input,
        .bio textarea {
            border: 1px solid #3eacb2;
            background-color: #f5feff;
            border-radius: 20px;
            padding: 10px 15px;
            font-family: "Oxygen", sans-serif;
        }

        .top,
        .middle,
        .bottom {
            display: flex;
            gap: 50px;
        }

        .firstname input,
        .lastname input,
        .dob input,
        .email input,
        .url input {
            width: 250px;
            font-weight: 400;
        }

        .bio textarea {
            width: 580px;
            font-weight: 400;
        }

        .bio input {
            width: 100px;
            background-color: #3eacb2;
            color: #f5feff;
            font-weight: 800;
        }

        .color {
            color: #3eacb2;
            font-family: "Oxygen", sans-serif;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Registration Form - Middle School</h1>
    </div>
    <div class="dailou">
        <form action="abc">
            <div class="top">
                <div class="firstname">
                    <input type="text" id="fname" name="fname" required placeholder="First Name">
                </div>
                <div class="lastname">
                    <input type="text" id="lname" name="lname" required placeholder="Last Name">
                </div>
            </div>
            <div class="middle">
                <div class="dob">
                    <input type="date">
                </div>
                <div class="email">
                    <input type="email" id="email" name="email" required placeholder="Email">
                </div>
            </div>
            <div class="bottom">
                <div class="url">
                    <input type="url" id="url" name="url" required placeholder="Homepage URL">
                </div>
                <div class="color">
                    <label for="color">Favourite Color</label><br>
                    <input type="checkbox" id="color" name="color" value="red">
                    <label for="color">red</label>

                    <input type="checkbox" id="color2" name="color2" value="blue">
                    <label for="color2">blue</label>

                    <input type="checkbox" id="color3" name="color3" value="black">
                    <label for="color3">black</label>

                    <input type="checkbox" id="color4" name="color4" value="purple">
                    <label for="color4">purple</label>

                    <input type="checkbox" id="color5" name="color5" value="other">
                    <label for="color5">other</label>
                </div>
            </div>
            <div class="bio">
                <textarea name="bio" id="bio" cols="50" rows="10" placeholder="Self Introduction"></textarea><br>
                <input type="submit" value="Submit">
            </div>
        </form>
    </div>
</body>

</html>
