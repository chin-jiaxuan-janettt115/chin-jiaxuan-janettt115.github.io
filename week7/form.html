<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <style>
        body {
            color: blueviolet;
        }

        input {
            border-radius: 20px;
            padding: 10px 15px;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Registration Form - Middle Scholl</h1>
    </div>

    <form action="abc">
        <div class="Top">
            <div class="firstname">
                <input type="text" id="fname" name="fname" required placeholder="first name">
            </div>
            <div class="lastname">
                <input type="text" id="lname" name="lname" required placeholder="last name">
            </div>
        </div>
        <div class="dob">
            <label for="dob">Date of birth</label><br>
            <input type="date">
        </div>
        <div class="email">
            <input type="email" id="email" name="email" required placeholder="email">
        </div>
        <div class="url">
            <input type="url" id="url" name="url" required placeholder="Homepage URL">
        </div>
        <div class="color">
            <label for="color">Favourite Color</label><br>
            <input type="checkbox" id="color" name="color" value="red">
            <label for="color">red</label>

            <input type="checkbox" id="color2" name="color2" value="blue">
            <label for="color2">blue</label>

            <input type="checkbox" id="color3" name="color3" value="black">
            <label for="color3">black</label>

            <input type="checkbox" id="color4" name="color4" value="purple">
            <label for="color4">purple</label>

            <input type="checkbox" id="color5" name="color5" value="other">
            <label for="color5">other</label>
        </div>
        <div class="bio">
            <textarea name="bio" id="bio" cols="50" rows="10" placeholder="Self Introduction"></textarea><br>
            <input type="submit" value="submit">
        </div>





    </form>
</body>

</html>
