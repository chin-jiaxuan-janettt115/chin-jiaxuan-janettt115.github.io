<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        font-family: "Oxygen", sans-serif;
    }

    body p {
        color:
            #9795a9;
    }

    .all {
        display: flex;
        gap: 150px;
        margin: auto;
    }

    .bigbox {
        background-color: #ffffff;
        padding: 20px;
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        box-shadow: 7px 6px 10px rgb(220, 220, 220);
    }

    .picture img {
        border-radius: 10px;
        width: 100%;
        max-width: 500px;
    }

    .middle {
        display: flex;
    }

    .left {
        width: 70%;
    }

    .right {
        width: 30%;
        position: relative;
    }

    .middle .left h3 {
        color: rgb(0, 0, 0);
        font-size: 30px;
    }

    .middle .left p {
        color: #aeadbc;
        font-size: 25px;
    }

    .icon {
        display: flex;
        gap: 30px;
    }

    .icon div {
        background-color: #f5f5f5;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 5px;
    }

    .icon img {
        width: 30px;
    }

    .bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .bottom img {
        width: 30px;
    }

    .bottom-left {
        display: flex;
        gap: 15px;
        align-items: center;
    }


    .smallbox {
        background-color: #b94040;
        padding: 15px;
        border-radius: 20px;
        display: flex;
        gap: 20px;
        position: absolute;
        bottom: 20px;
        left: -20%;
    }

    .smallbox .building {
        width: 50px;
    }

    .smallbox img {
        border-radius: 50%;
        width: 100%;
    }

    .number {
        color: #8a79df;
        margin: 0px;
        font-weight: bolder;
    }

    .completed {
        display: flex;
        gap: 5px;
        margin-top: 10px;
    }

    .loading {
        background-color: rgb(229, 229, 229);
        border-radius: 10px;
        height: 5px;
        width: 200px;
    }

    .smallloading {
        background-color: rgb(151, 142, 202);
        border-radius: 10px;
        height: 5px;
        width: 50%;
        margin-top: 5px;
    }

    .com {
        margin: 0px;
        font-weight: bolder;
        color: black;
    }

    .small-right h3,
    .small-right .ongoing {
        margin: 0px;
    }

    .ongoing {
        font-weight: bolder;
    }

    @media screen and (max-width: 1350px) {
        .all {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            justify-content: center;
        }
    }

    @media screen and (max-width: 1100px) {

        .smallbox {
            position: absolute;
            width: fit-content;
            bottom: 20px;
            left: -70px;
            gap: 10px;
        }

        .middle .left p {
            font-size: 20px;
        }

        .middle .left h3 {
            font-size: 30px;
        }

        .loading {
            width: 130px;
        }

        .smallloading {
            width: 50%;
        }

    }
</style>

<body>
    <div class="all">
        <div class="bigbox">
            <div class="picture"><img src="image/greec.jpeg" alt="landscape"></div>
            <div class="middle">
                <div class="left">
                    <h3>Trip to Greece</h3>
                    <p>14-29 June | by Robbin jackson</p>
                    <div class="icon">
                        <div><img src="image/leaf.png" alt="leaf"></div>
                        <div><img src="image/map.png" alt="map"></div>
                        <div><img src="image/gps.png" alt="gps"> </div>
                    </div>
                </div>

                <div class="right">
                    <div class="smallbox">
                        <div class="building"><img src="image/rome.jpg" alt="rome"></div>
                        <div class="small-right">
                            <p class="ongoing">Ongoing</p>
                            <h3>Trip to rome</h3>
                            <div class="completed">
                                <p class="number">40%</p>
                                <p class="com">completed</p>
                            </div>
                            <div class="loading">
                                <div class="smallloading"></div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
            <div class="bottom">
                <div class="bottom-left"><img src="image/building.png" alt="building">
                    <p>24 people going</p>
                </div>
                <div class="heart"><img src="image/heart.png" alt=""></div>
            </div>

        </div>
        <div class="bigbox">
            <div class="picture"><img src="image/greec.jpeg" alt="landscape"></div>
            <div class="middle">
                <div class="left">
                    <h3>Trip to Greece</h3>

                        <div><img src="image/gps.png" alt="gps"> </div>
                    </div>
                </div>

                <div class="right">
                    <div class="smallbox">
                        <div class="building"><img src="image/rome.jpg" alt="rome"></div>
                        <div class="small-right">
                            <p class="ongoing">Ongoing</p>
                            <h3>Trip to rome</h3>
                            <div class="completed">
                                <p class="number">40%</p>
                                <p class="com">completed</p>
                            </div>
                            <div class="loading">
                                <div class="smallloading"></div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
            <div class="bottom">
                <div class="bottom-left"><img src="image/building.png" alt="building">
                    <p>24 people going</p>
                </div>
                <div class="heart"><img src="image/heart.png" alt=""></div>
            </div>

        </div>
    </div>
</body>

</html>
