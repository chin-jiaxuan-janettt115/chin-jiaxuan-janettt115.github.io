<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>relative-travel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxygen:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/relative-travel.css">
</head>
<style>
    body {
        font-family: "Oxygen", sans-serif;
    }

    body p {
        color:
            #9795a9;
    }

    .all {
        display: flex;
        gap: 150px;
        margin: auto;
    }

    .first {
        position: relative;
    }

    .bigbox {
        background-color: #ffffff;
        padding: 20px;
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        box-shadow: 7px 6px 10px rgb(220, 220, 220);
    }



    .middle .landscape img {
        border-radius: 10px;
        width: 100%;
        max-width: 500px;
    }

    .smallbox {
        background-color: #ffffff;
        padding: 15px;
        border-radius: 20px;
        display: flex;
        gap: 20px;
        position: relative;
        bottom: 35%;
        left: 50%;
        width: fit-content;
        max-width: 90%;
    }


    .icon {
        display: flex;
        gap: 30px;
    }

    .icon div {
        background-color: #f5f5f5;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 5px;
    }

    .icon img {
        width: 30px;
    }

    .people-going {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .people-going img {
        width: 30px;
    }

    .people-going .right {
        display: flex;
        gap: 15px;
        align-items: center;
    }

    .bulding {
        width: 20%;
    }

    .smallbox img {
        border-radius: 50%;
        width: 100%;
    }

    .number {
        color:
            #8a79df;
        margin: 0px;
        font-weight: bolder;
    }

    .completed {
        display: flex;
        gap: 5px;
        margin-top: 10px;
    }

    .loading {
        background-color: rgb(229, 229, 229);
        border-radius: 10px;
        height: 10px;
        width: 200px;
        margin-top: 15px;
    }

    .smallloading {
        background-color: rgb(151, 142, 202);
        border-radius: 10px;
        height: 10px;
        width: 100px;
        margin-top: 10px;
    }

    .com {
        margin: 0px;
        font-weight: bolder;
        color: black;
    }

    .middle h3 {
        color: rgb(0, 0, 0);
        font-size: 30px;
    }

    .middle p {
        color: #aeadbc;
        font-size: 25px;
    }

    .small-right h3,
    .small-right .ongoing {
        margin: 0px;

    }

    .ongoing {
        font-weight: bolder;
    }



    @media screen and (max-width: 1100px) {
        .all {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            justify-content: center;
        }

        .smallbox {
            position: absolute;
            width: 60%;
        }

        .middle p {
            font-size: 20px;
        }

        .middle h3 {
            font-size: 30px;
        }

    }
</style>

<body>
    <div class="all">
        <div class="first">
            <div class="bigbox">
                <div class="middle">
                    <div class="landscape"><img src="image/greec.jpeg" alt="landscape"></div>
                    <h3>Trip to Greece</h3>
                    <p>14-29 June | by Robbin jackson</p>
                    <div class="icon">
                        <div><img src="image/leaf.png" alt="leaf"></div>
                        <div><img src="image/map.png" alt="map"></div>
                        <div><img src="image/gps.png" alt="gps"> </div>
                    </div>
                </div>
                <div class="people-going">
                    <div class="right"><img src="image/building.png" alt="building">
                        <p>24 people going</p>
                    </div>
                    <div class="heart"><img src="image/heart.png" alt=""></div>
                </div>
            </div>
            <div class="smallbox">
                <div class="bulding"><img src="image/rome.jpg" alt="rome"></div>
                <div class="small-right">
                    <p class="ongoing">Ongoing</p>
                    <h3>Trip to rome</h3>
                    <div class="completed">
                        <p class="number">40%</p>
                        <p class="com">completed</p>
                    </div>
                    <div class="loading">
                        <div class="smallloading"></div>
                    </div>
                </div>

            </div>
        </div>
        <div class="first">
            <div class="bigbox">
                <div class="middle">
                    <div class="landscape"><img src="image/greec.jpeg" alt="landscape"></div>
                    <h3>Trip to Greece</h3>
                    <p>14-29 June | by Robbin jackson</p>
                    <div class="icon">
                        <div><img src="image/leaf.png" alt="leaf"></div>
                        <div><img src="image/map.png" alt="map"></div>
                        <div><img src="image/gps.png" alt="gps"> </div>
                    </div>
                </div>
                <div class="people-going">
                    <div class="right"><img src="image/building.png" alt="building">
                        <p>24 people going</p>
                    </div>
                    <div class="heart"><img src="image/heart.png" alt=""></div>
                </div>
            </div>
            <div class="smallbox">
                <div class="bulding"><img src="image/rome.jpg" alt="rome"></div>
                <div class="small-right">
                    <p class="ongoing">Ongoing</p>
                    <h3>Trip to rome</h3>
                    <div class="completed">
                        <p class="number">40%</p>
                        <p class="com">completed</p>
                    </div>
                    <div class="loading">
                        <div class="smallloading"></div>
                    </div>
                </div>

            </div>
        </div>

    </div>
</body>

</html>
