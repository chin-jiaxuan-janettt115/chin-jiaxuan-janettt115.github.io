<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>relative-travel</title>
    <link rel="stylesheet" href="css/relative-travel.css">
</head>
<style>
    body {
        background-color: rgb(54, 54, 133);
    }

    .all {
        display: flex;
        gap: 20px;
        margin: auto;
    }

    .bottom {
        background-color: #6f4d4d;
        padding: 20px;
        border-radius: 20px;
        text-align: center;

    }

    .middle div {
        justify-content: center;
    }

    .bottom img {
        width: 100%;
        max-width: 500px;
        border-radius: 30px;
    }

    .top {
        background-color: #ffffff;
        padding: 15px;
        border-radius: 20px;
        display: flex;
        gap: 20px;
        width: 50%;
    }


    .icon {
        display: flex;
        gap: 30px;
    }

    .icon img {
        background-color: #cccaca;
        width: 30px;
        border-radius: 50%;
        padding: 20%;
    }

    .people-going {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .people-going img {
        width: 25px;
    }

    .people-going .right {
        display: flex;
        gap: 15px;
    }

    .top img {
        border-radius: 50%;
        width: 100%;
        max-width: 70px;
    }
</style>

<body>
    <div class="all">
        <div class="first">
            <div class="bottom">
                <div class="middle">
                    <img src="image/greec.jpeg" alt="landscape">
                    <h3>Trip to Greece</h3>
                    <p>14-29 June| by Robbin jackson</p>
                    <div class="icon">
                        <div><img src="image/leaf.png" alt="leaf"></div>
                        <div><img src="image/map.svg" alt="map"></div>
                        <div><img src="image/gps.png" alt="gps"> </div>
                    </div>
                </div>
                <div class="people-going">
                    <div class="right"><img src="image/building.png" alt="building">
                        <p>24 people going</p>
                    </div>
                    <div class="heart"><img src="image/heart.png" alt=""></div>
                </div>
            </div>
            <div class="top">
                <div class="bulding"><img src="image/rome.jpg" alt="rome"></div>
                <div class="top-right">
                    <p>ongoing</p>
                    <h3>Trip to rome</h3>
                    <p>40%completed</p>
                </div>
                <div></div>
            </div>
        </div>
    </div>
</body>

</html>
