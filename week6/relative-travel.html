<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>relative-travel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxygen:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/relative-travel.css">
</head>
<style>
    body {
        background-color: rgb(239, 245, 254);
        font-family: "Oxygen", sans-serif;
    }

    .all {
        display: flex;
        gap: 100px;
    }

    .bottom {
        background-color: #ffffff;
        padding: 20px;
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }


    .bottom img {
        width: 100%;
        max-width: 500px;
        border-radius: 30px;
    }

    .smallbox {
        background-color: #ffffff;
        padding: 15px;
        border-radius: 20px;
        display: flex;
        gap: 20px;
        width: 35%;
        position: absolute;
        bottom: 150px;
        left: 300px;
        width: fit-content;
    }


    .icon {
        display: flex;
        gap: 30px;
    }

    .icon img {
        background-color: #e9e9e9;
        width: 30px;
        border-radius: 50%;
        padding: 20%;
    }

    .people-going {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .people-going img {
        width: 25px;
    }

    .people-going .right {
        display: flex;
        gap: 15px;
    }

    .smallbox img {
        border-radius: 50%;
        width: 100%;
        max-width: 70px;
    }

    .number {
        color: rgb(163, 144, 238);
        margin: 0px;
        font-weight: bolder;
    }

    .completed {
        display: flex;
        gap: 5px;
        margin-top: 10px;
    }

    .loading {
        background-color: rgb(229, 229, 229);
        border-radius: 10px;
        height: 10px;
        width: 200px;
        margin-top: 15px;
    }

    .smallloading {
        background-color: rgb(39, 21, 141);
        border-radius: 10px;
        height: 10px;
        width: 100px;
        margin-top: 10px;
    }

    .com {
        margin: 0px;
        font-weight: bolder;
    }

    .middle h3 {
        color: rgb(0, 0, 0);
        font-size: 30px;
    }

    .middle p {
        color: #888888;
        font-size: 25px;
    }

    .small-right h3,
    .small-right .ongoing {
        margin: 0px;
    }

    .ongoing {
        font-weight: bolder;
    }

    @media screen and (max-width: 1100px) {
        .all {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            justify-content: center;
        }

    }
</style>

<body>
    <div class="all">
        <div class="first">
            <div class="bottom">
                <div class="middle">
                    <img src="image/greec.jpeg" alt="landscape">
                    <h3>Trip to Greece</h3>
                    <p>14-29 June | by Robbin jackson</p>
                    <div class="icon">
                        <div><img src="image/leaf.png" alt="leaf"></div>
                        <div><img src="image/map.png" alt="map"></div>
                        <div><img src="image/gps.png" alt="gps"> </div>
                    </div>
                </div>
                <div class="people-going">
                    <div class="right"><img src="image/building.png" alt="building">
                        <p>24 people going</p>
                    </div>
                    <div class="heart"><img src="image/heart.png" alt=""></div>
                </div>
            </div>
            <div class="smallbox">
                <div class="bulding"><img src="image/rome.jpg" alt="rome"></div>
                <div class="small-right">
                    <p class="ongoing">Ongoing</p>
                    <h3>Trip to rome</h3>
                    <div class="completed">
                        <p class="number">40%</p>
                        <p class="com">completed</p>
                    </div>
                    <div class="loading">
                        <div class="smallloading"></div>
                    </div>
                </div>
                <div></div>
            </div>
        </div>
        <div class="first">
            <div class="bottom">
                <div class="middle">
                    <img src="image/greec.jpeg" alt="landscape">
                    <h3>Trip to Greece</h3>
                    <p>14-29 June | by Robbin jackson</p>
                    <div class="icon">
                        <div><img src="image/leaf.png" alt="leaf"></div>
                        <div><img src="image/map.png" alt="map"></div>
                        <div><img src="image/gps.png" alt="gps"> </div>
                    </div>
                </div>
                <div class="people-going">
                    <div class="right"><img src="image/building.png" alt="building">
                        <p>24 people going</p>
                    </div>
                    <div class="heart"><img src="image/heart.png" alt=""></div>
                </div>
            </div>
            <div class="smallbox">
                <div class="bulding"><img src="image/rome.jpg" alt="rome"></div>
                <div class="small-right">
                    <p class="ongoing">Ongoing</p>
                    <h3>Trip to rome</h3>
                    <div class="completed">
                        <p class="number">40%</p>
                        <p class="com">completed</p>
                    </div>
                    <div class="loading">
                        <div class="smallloading"></div>
                    </div>
                </div>
                <div></div>
            </div>
        </div>

    </div>
</body>

</html>
