<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>relative-travel</title>
    <link rel="stylesheet" href="css/relative-travel.css">
</head>

<body>
    <div class="all">
        <div class="bigbox">
            <div class="picture"><img src="image/greec.jpeg" alt="landscape"></div>
            <div class="middle">
                <div class="left">
                    <h3>Trip to Greece</h3>
                    <p>14-29 June | by Robbin jackson</p>
                    <div class="icon">
                        <div><img src="image/leaf.png" alt="leaf"></div>
                        <div><img src="image/map.png" alt="map"></div>
                        <div><img src="image/gps.png" alt="gps"> </div>
                    </div>
                </div>

                <div class="right">
                    <div class="smallbox">
                        <div class="building"><img src="image/rome.jpg" alt="rome"></div>
                        <div class="small-right">
                            <p class="ongoing">Ongoing</p>
                            <h3>Trip to rome</h3>
                            <div class="completed">
                                <p class="number">40%</p>
                                <p class="com">completed</p>
                            </div>
                            <div class="loading">
                                <div class="smallloading"></div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
            <div class="bottom">
                <div class="bottom-left"><img src="image/building.png" alt="building">
                    <p>24 people going</p>
                </div>
                <div class="heart"><img src="image/heart.png" alt=""></div>
            </div>

        </div>

</html>
